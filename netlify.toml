[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npx @11ty/eleventy --serve"
  targetPort = 8080
  publish = "_site"

# Kept from before the Eleventy migration
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/analytics.html"
  status = 200

# Retired: the journal post described Finding Drake's Feather as a children's book; it is a memoir.
# The post is parked in src/_drafts until Courtney rewrites it.
[[redirects]]
  from = "/blog/posts/keeping-what-love-leaves.html"
  to = "/books/finding-drakes-feather.html"
  status = 301

# Additions only: extensionless convenience rewrites. The .html URLs stay canonical.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200

[[redirects]]
  from = "/books/:slug"
  to = "/books/:slug.html"
  status = 200

[[redirects]]
  from = "/blog/posts/:slug"
  to = "/blog/posts/:slug.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
